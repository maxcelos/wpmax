services:
  proxy:
    image: nginx:alpine
    container_name: wpmax_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ${WPMAX_CERTS_DIR}:/etc/nginx/certs:ro

networks:
  default:
    name: wpmax
    external: true
